# Supply-chain policy (M0-03). Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, notice)
# fails the build unless listed in `ignore` with a reason.
version = 2
yanked = "deny"
ignore = [
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6.
    # They come in through keyring's Linux Secret Service store
    # (secret-service on zbus 5); "unmaintained" only, no vulnerability.
    # Drop these once secret-service moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant merged into zbus 6; via keyring/secret-service" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names merged into zbus 6; via keyring/secret-service" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive merged into zbus 6; via keyring/secret-service" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
# Permissive licences only; anything else (GPL, AGPL, LGPL, SSPL, ...) fails.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    # MIT without the attribution clause (borrow-or-share, via jsonschema)
    "MIT-0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
