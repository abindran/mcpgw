name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Pushes to main get one group per commit, so no commit's run is dropped
  # as "pending" by a later push; PR runs supersede each other.
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.ref) || format('ci-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rules:
    name: Dependency rule & canary scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-deps.sh
      - run: bash scripts/canary-scan.sh

  supply-chain:
    name: Supply chain (deny, audit, SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit,cargo-cyclonedx
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings
      - run: bash scripts/supply-chain-selftest.sh
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: "**/*.cdx.json"
          if-no-files-found: error

  docs:
    name: Docs (mdBook)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      # missing pages fail the build (create-missing = false)
      - run: mdbook build docs

  lint:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV 1.98
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  macos-app:
    name: macOS app (SwiftUI)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-app
      # the app's end-to-end test drives a real daemon with fake-mcp
      - run: cargo build --locked -p mcpgw -p mcpgw-testkit
      - run: swift test --package-path macos
        env:
          MCPGW_MAC_E2E: "1"
      - run: macos/build.sh --debug
      - run: codesign --verify --strict --deep target/macos/mcpgw.app

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    # the Intel macOS runner needs more than 15 minutes for the full suite
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            keychain: "1"
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            keychain: "1"
          - name: Linux glibc
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            containers: "1"
            wasm: "1"
          - name: Linux musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            containers: "1"
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            keychain: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # the SDK template test builds a guest for wasm32-unknown-unknown
          targets: ${{ matrix.target }}${{ matrix.wasm && ',wasm32-unknown-unknown' || '' }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --locked --target ${{ matrix.target }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
        env:
          MCPGW_TEST_KEYCHAIN: ${{ matrix.keychain }}
          # Linux runners have Docker: container tests must run there
          MCPGW_TEST_CONTAINERS: ${{ matrix.containers }}
          MCPGW_TEST_WASM: ${{ matrix.wasm }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcpgw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debug/mcpgw
            target/${{ matrix.target }}/debug/mcpgw.exe
          if-no-files-found: error
          retention-days: 7
