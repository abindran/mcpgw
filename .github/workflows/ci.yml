name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rules:
    name: Dependency rule & canary scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/check-deps.sh
      - run: bash scripts/canary-scan.sh

  lint:
    name: fmt / clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  msrv:
    name: MSRV 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  test:
    name: test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - name: Linux glibc
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: Linux musl
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - name: Windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --workspace --locked --target ${{ matrix.target }}
      - run: cargo test --workspace --locked --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: mcpgw-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/debug/mcpgw
            target/${{ matrix.target }}/debug/mcpgw.exe
          if-no-files-found: error
          retention-days: 7
