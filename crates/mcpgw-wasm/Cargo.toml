[package]
name = "mcpgw-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Wasm tool servers for mcpgw: wasmtime, the component model and WASI p2"

[dependencies]
wasmtime = { version = "49.0.4", default-features = false, features = ["runtime", "cranelift", "component-model", "async", "pooling-allocator", "std", "parallel-compilation"] }
wasmtime-wasi = { version = "49.0.4", default-features = false, features = ["p2"] }
serde_json.workspace = true
sha2.workspace = true
wit-component = "0.262"
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
