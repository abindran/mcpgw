[package]
name = "mcpgw"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mcpgw"
path = "src/main.rs"

[dependencies]
mcpgw-core.workspace = true
mcpgw-config.workspace = true
mcpgw-auth.workspace = true
mcpgw-store.workspace = true
mcpgw-router.workspace = true
mcpgw-runtime.workspace = true
mcpgw-telemetry.workspace = true
mcpgw-api.workspace = true
mcpgw-proto.workspace = true
mcpgw-vault.workspace = true
secrecy = "0.10"
rpassword = "7"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "signal", "time", "net"] }

[dev-dependencies]
mcpgw-vault.workspace = true
secrecy = "0.10"
mcpgw-testkit.workspace = true
serde_json.workspace = true
