<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mcpgw</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js" defer></script>
</head>
<body>
<header>
  <h1>mcpgw</h1>
  <p id="runtime" aria-live="polite">connecting…</p>
</header>
<main>
  <p id="notice" class="notice" hidden></p>

  <section aria-labelledby="h-approvals" id="approvals-section">
    <h2 id="h-approvals">Waiting for approval</h2>
    <p class="empty" id="approvals-empty">Nothing is waiting.</p>
    <ul id="approvals" class="cards"></ul>
  </section>

  <section aria-labelledby="h-servers">
    <h2 id="h-servers">Servers</h2>
    <div class="scroll">
      <table>
        <thead><tr><th>Server</th><th>State</th><th>Tools</th><th>Source</th><th></th></tr></thead>
        <tbody id="servers"></tbody>
      </table>
    </div>
  </section>

  <section aria-labelledby="h-calls">
    <h2 id="h-calls">Recent calls</h2>
    <p class="empty" id="calls-empty">No calls yet.</p>
    <div class="scroll">
      <table id="calls-table">
        <thead><tr><th>Time</th><th>Tool</th><th>Endpoint</th><th>Outcome</th><th class="num">ms</th></tr></thead>
        <tbody id="calls"></tbody>
      </table>
    </div>
  </section>
</main>
<template id="login">
  <p>Open this page with <code>mcpgw ui</code>, which signs you in.</p>
</template>
</body>
</html>
