[package]
name = "mcpgw-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# NOTE: This is the ONLY crate permitted to depend on `rmcp`.
# All MCP protocol handling and version bridging lives here so that
# protocol churn stays contained behind this seam. CI (M0-02) enforces
# that no other workspace crate imports `rmcp`.
[dependencies]
# Pinned in the M0-04 spike (see wiki/M0-04-rmcp-Server-Spike.md).
rmcp = { version = "3.5.1", features = ["server", "client", "transport-io", "macros", "transport-child-process", "transport-streamable-http-server", "transport-streamable-http-client-reqwest"] }
futures = "0.3"
mcpgw-core.workspace = true
reqwest.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
process-wrap = { version = "10", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "time", "io-std", "io-util"] }
tracing = { workspace = true }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
