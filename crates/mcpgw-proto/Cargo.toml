[package]
name = "mcpgw-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# NOTE: This is the ONLY crate permitted to depend on `rmcp`.
# All MCP protocol handling and version bridging lives here so that
# protocol churn stays contained behind this seam. CI (M0-02) enforces
# that no other workspace crate imports `rmcp`.
[dependencies]
# Pinned in the M0-04 spike (see wiki/M0-04-rmcp-Server-Spike.md).
rmcp = { version = "3.5.1", features = ["server", "client", "transport-io", "macros", "transport-child-process"] }
serde = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = "1.0.154"
tokio = { workspace = true, features = ["rt", "macros", "io-util"] }
