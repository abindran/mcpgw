# mcpgw — workspace root
#
# Crate layout (plan M0-01):
#   mcpgw            -> CLI entry and local daemon (the binary)
#   mcpgw-proto      -> MCP adapter; the ONLY crate allowed to depend on `rmcp`
#   mcpgw-core       -> domain types: servers, tools, profiles, manifests, policies, errors
#   mcpgw-config     -> TOML load, validation, hot reload, import from client configs
#   mcpgw-store      -> local persistence in SQLite behind a trait
#   mcpgw-vault      -> envelope encryption, key providers, secret injection, redaction
#   mcpgw-router     -> aggregation, namespacing, meta-tools, policy checks, result pipeline
#   mcpgw-runtime    -> supervisor, lifecycle state machine, launchers
#   mcpgw-auth       -> loopback client token, OAuth broker, upstream OAuth
#   mcpgw-api        -> admin REST API, SSE events, static web UI
#   mcpgw-telemetry  -> tracing, metrics, audit log writer
#   xtask            -> build, release, conformance and e2e helpers
#
# Dependency rule (enforced in CI): no crate other than `mcpgw-proto` may
# import `rmcp`. Protocol churn stays inside that one seam.

[workspace]
resolver = "3"
members = [
    "crates/mcpgw",
    "crates/mcpgw-proto",
    "crates/mcpgw-core",
    "crates/mcpgw-config",
    "crates/mcpgw-store",
    "crates/mcpgw-vault",
    "crates/mcpgw-router",
    "crates/mcpgw-runtime",
    "crates/mcpgw-auth",
    "crates/mcpgw-api",
    "crates/mcpgw-telemetry",
    "crates/mcpgw-testkit",
    "xtask",
]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
authors = ["abindran"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/abindran/mcpgw"

[workspace.dependencies]
# Internal crates
mcpgw-proto = { path = "crates/mcpgw-proto", version = "0.1.0" }
mcpgw-core = { path = "crates/mcpgw-core", version = "0.1.0" }
mcpgw-config = { path = "crates/mcpgw-config", version = "0.1.0" }
mcpgw-store = { path = "crates/mcpgw-store", version = "0.1.0" }
mcpgw-vault = { path = "crates/mcpgw-vault", version = "0.1.0" }
mcpgw-router = { path = "crates/mcpgw-router", version = "0.1.0" }
mcpgw-runtime = { path = "crates/mcpgw-runtime", version = "0.1.0" }
mcpgw-auth = { path = "crates/mcpgw-auth", version = "0.1.0" }
mcpgw-api = { path = "crates/mcpgw-api", version = "0.1.0" }
mcpgw-telemetry = { path = "crates/mcpgw-telemetry", version = "0.1.0" }
mcpgw-testkit = { path = "crates/mcpgw-testkit", version = "0.1.0" }

# Shared third-party crates
thiserror = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tracing = "0.1"
toml = "0.8"
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4.6", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.4"
